services:
  translate-web:
    build: .
    container_name: translate-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - fluentics-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fluentics-data:
