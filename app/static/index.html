<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202124">
  <title>FluenTics</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <span></span>
      <button id="settings-button" class="settings-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
    </header>
    <section id="start-view" class="start-view" aria-labelledby="title">
      <h1 id="title">Fluen<span>Tics</span></h1>
      <p class="subtitle">English · Spanish <span class="model-label">· <span id="model-name">loading model…</span></span></p>
      <form id="translate-form" class="search-box">
        <textarea id="source-text" maxlength="5000" autofocus placeholder="Type or paste your text here..." aria-label="Text to translate"></textarea>
        <div class="search-actions">
          <span id="char-count">0 / 5000</span>
          <button type="submit">Translate</button>
        </div>
      </form>
      <p id="start-error" class="error" role="alert" hidden></p>
    </section>

    <section id="result-view" class="result-view" hidden aria-live="polite">
      <div class="result-topbar">
        <button id="new-translation" class="text-button" type="button">← New translation</button>
        <span id="language-label" class="language-label"></span>
      </div>
      <section id="corrections-panel" class="corrections-panel" hidden>
        <h2>Corrections</h2>
        <div id="corrections-list"></div>
      </section>
      <article class="result-card">
        <div id="original-output" class="original-output"></div>
        <div id="translation-output" class="translation-output"></div>
        <div class="result-footer">
          <span id="latency"></span>
          <button id="copy-button" class="copy-button" type="button">Copy</button>
        </div>
      </article>
      <section id="alternatives-panel" class="alternatives-panel" hidden>
        <h2>Other ways to say it</h2>
        <div id="alternatives-list"></div>
      </section>
      <p id="result-error" class="error" role="alert" hidden></p>
    </section>

    <div id="loading" class="loading" hidden><span></span><span></span><span></span><strong>Translating…</strong></div>

    <dialog id="settings-dialog" class="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="settings-header"><h2>Settings</h2><button id="close-settings" class="close-button" type="button" aria-label="Close">×</button></div>
        <label for="settings-provider">Provider</label>
        <select id="settings-provider" name="provider">
          <option value="openai">OpenAI</option>
          <option value="claude">Claude</option>
          <option value="gemini">Gemini</option>
          <option value="grok">Grok</option>
          <option value="deepseek">DeepSeek</option>
        </select>
        <p class="settings-help">API keys are stored in the application data directory and are never returned to the browser.</p>
        <label for="settings-openai-key">OpenAI API key</label>
        <input id="settings-openai-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the current key">
        <label for="settings-claude-key">Claude API key</label>
        <input id="settings-claude-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the current key">
        <label for="settings-gemini-key">Gemini API key</label>
        <input id="settings-gemini-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the current key">
        <label for="settings-grok-key">Grok API key</label>
        <input id="settings-grok-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the current key">
        <label for="settings-deepseek-key">DeepSeek API key</label>
        <input id="settings-deepseek-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the current key">
        <label for="settings-model">Primary model</label>
        <input id="settings-model" name="model" type="text" autocomplete="off" required>
        <label for="settings-fallback-model">Fallback model</label>
        <input id="settings-fallback-model" name="fallback_model" type="text" autocomplete="off" required>
        <label for="settings-direction">Translation direction</label>
        <select id="settings-direction" name="direction">
          <option value="auto">Automatic (detect language)</option>
          <option value="en-es">English → Spanish</option>
          <option value="es-en">Spanish → English</option>
        </select>
        <label for="settings-prompt">Prompt</label>
        <textarea id="settings-prompt" name="prompt" rows="9" required></textarea>
        <p id="settings-status" class="settings-status" role="status"></p>
        <div class="settings-actions"><button id="cancel-settings" class="secondary-button" type="button">Cancel</button><button type="submit">Save</button></div>
      </form>
    </dialog>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
